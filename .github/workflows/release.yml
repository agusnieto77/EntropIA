name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_platform:
        description: 'Platforms to build. Tag pushes intentionally build Windows only; use all only from manual dispatch.'
        required: false
        default: 'windows'
        type: choice
        options:
          - windows
          - all
      runtime_payload_artifact:
        description: 'Artifact from Runtime Payload workflow, usually runtime-payloads. Leave blank only when another release job supplies payloads.'
        required: false
        type: string

env:
  PNPM_VERSION: 9.15.4
  MACOSX_DEPLOYMENT_TARGET: '10.15'
  CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Safe default: tag pushes publish Windows installers only. Multi-platform
    # releases must be requested explicitly from workflow_dispatch.
    if: ${{ (github.event_name == 'push' && matrix.platform == 'windows-latest') || (github.event_name == 'workflow_dispatch' && (inputs.release_platform == 'all' || (inputs.release_platform == 'windows' && matrix.platform == 'windows-latest'))) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-latest
            platform: windows-latest
            build_args: ''
            rust_target: ''
            runtime_pack_platform: windows-x86_64
          - name: macos-14 (arm64)
            platform: macos-14
            build_args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
            runtime_pack_platform: ''
          - name: ubuntu-22.04
            platform: ubuntu-22.04
            build_args: '-- --no-default-features'
            rust_target: ''
            runtime_pack_platform: linux-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select runtime-pack platform
        id: runtime_pack
        shell: bash
        run: |
          echo "platform=${{ matrix.runtime_pack_platform }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libleptonica-dev \
            libtesseract-dev \
            pkg-config \
            patchelf

      - name: Install macOS OCR dependencies
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew update
          brew install leptonica tesseract pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix leptonica)/lib/pkgconfig:$(brew --prefix tesseract)/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Install Windows OCR dependencies (vcpkg)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:USERPROFILE\vcpkg\vcpkg.exe" install tesseract:x64-windows-static-md
          "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install Rust target (macOS cross-compilation)
        if: matrix.rust_target != ''
        run: |
          rustup target add ${{ matrix.rust_target }}

      - name: Restore canonical lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: pwsh
        run: npm exec --package=pnpm@${{ env.PNPM_VERSION }} -- pnpm install --frozen-lockfile

      - name: Download runtime payload artifact
        if: steps.runtime_pack.outputs.platform != '' && github.event_name == 'workflow_dispatch' && inputs.runtime_payload_artifact != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.runtime_payload_artifact }}
          path: ${{ runner.temp }}/runtime-payloads

      - name: Assemble runtime-pack payload (release required)
        if: steps.runtime_pack.outputs.platform != '' && github.event_name == 'workflow_dispatch' && inputs.runtime_payload_artifact != ''
        shell: bash
        run: |
          RUNTIME_PAYLOAD_ROOT="${RUNNER_TEMP}/runtime-payloads"
          ASSEMBLED_RUNTIME_PACK_ROOT="apps/desktop/src-tauri/target/runtime-pack"
          python3 apps/desktop/src-tauri/scripts/build_runtime_pack.py --platform ${{ steps.runtime_pack.outputs.platform }} --payload-root "$RUNTIME_PAYLOAD_ROOT" --output-dir "$ASSEMBLED_RUNTIME_PACK_ROOT" --require-release-payload

      - name: runtime-pack-smoke
        if: steps.runtime_pack.outputs.platform != '' && github.event_name == 'workflow_dispatch' && inputs.runtime_payload_artifact != ''
        shell: bash
        run: python3 apps/desktop/src-tauri/scripts/runtime-pack-smoke.py --platform ${{ steps.runtime_pack.outputs.platform }} --root apps/desktop/src-tauri/target/runtime-pack --release --install-probe

      - name: Inject assembled runtime-pack into bundle resources
        if: steps.runtime_pack.outputs.platform != '' && github.event_name == 'workflow_dispatch' && inputs.runtime_payload_artifact != ''
        shell: bash
        run: |
          PLATFORM="${{ steps.runtime_pack.outputs.platform }}"
          rm -rf "apps/desktop/src-tauri/resources/runtime-pack/$PLATFORM"
          cp -R "apps/desktop/src-tauri/target/runtime-pack/$PLATFORM" "apps/desktop/src-tauri/resources/runtime-pack/$PLATFORM"

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EntropIA ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download the installer for your platform.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.build_args }}
